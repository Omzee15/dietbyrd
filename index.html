<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diet By RD — India's Gold Standard Clinical Nutrition</title>
    <meta name="description" content="India's first clinical nutrition platform where every consultation is exclusively with a Registered Dietitian. Evidence-based. Affordable. Honest." />
    <meta name="author" content="Diet By RD Private Limited" />

    <!-- PWA -->
    <!-- PWA manifest is injected automatically by vite-plugin-pwa (see vite.config.ts) -->
    <meta name="theme-color" content="#1B2B3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Diet By RD" />

    <!-- Icons -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Preload critical assets -->
    <link rel="preload" href="/signin-image-nobg.webp" as="image" type="image/webp" />
    <link rel="preload" href="/doctors-nobg.webp" as="image" type="image/webp" />

    <!-- Fonts. These were previously pulled in with @import -- from index.css
         and, worse, from inline <style> blocks inside page components. An
         @import is only discovered after the importing stylesheet has been
         fetched and parsed, so the component-level ones sat behind the whole
         JS bundle: HTML -> JS -> render -> inject <style> -> discover font
         CSS -> fetch font files. Declaring them here puts every font request
         in the initial HTML parse, so they start in parallel with the JS
         instead of queueing behind it. preconnect (not just dns-prefetch)
         also gets TCP+TLS to the font hosts out of the way up front. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Diet By RD — India's Gold Standard Clinical Nutrition" />
    <meta property="og:description" content="India's first clinical nutrition platform where every consultation is exclusively with a Registered Dietitian." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dietbyrd.buildc3.tech" />
    <meta property="og:image" content="https://dietbyrd.buildc3.tech/icons/icon-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DietByRD" />
    <meta name="twitter:image" content="https://dietbyrd.buildc3.tech/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
